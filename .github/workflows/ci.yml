name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: typecheck-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: tooli-chatbot-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-configs:
    name: Validate observability configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Prometheus config
        run: |
          docker run --rm -v $PWD/observability:/etc/prometheus \
            --entrypoint /bin/sh \
            prom/prometheus:v2.55.0 \
            -c "sed 's|__TOKEN__|test-token|' /etc/prometheus/prometheus.yml > /tmp/p.yml && promtool check config /tmp/p.yml"

      - name: Validate alert rules
        run: |
          docker run --rm -v $PWD/observability:/etc/prometheus \
            --entrypoint promtool \
            prom/prometheus:v2.55.0 \
            check rules /etc/prometheus/alerts.yml

      - name: Validate Alertmanager config
        run: |
          docker run --rm -v $PWD/observability:/etc/alertmanager \
            --entrypoint /bin/sh \
            prom/alertmanager:v0.27.0 \
            -c "sed -e 's|__SLACK_WEBHOOK_URL__|https://hooks.slack.com/services/X/Y/Z|' -e 's|__ALERT_EMAIL_TO__|test@x.com|' -e 's|__ALERT_EMAIL_FROM__|alerts@x.com|' -e 's|__SMTP_HOST__|smtp.x.com:587|' -e 's|__SMTP_USER__|u|' -e 's|__SMTP_PASSWORD__|p|' /etc/alertmanager/alertmanager.yml > /tmp/a.yml && amtool check-config /tmp/a.yml"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    concurrency:
      group: tooli-production
      cancel-in-progress: false
    needs: [typecheck-build, docker-build, validate-configs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/tooli-chatbot
            git pull --ff-only origin main
            docker compose up -d --build
