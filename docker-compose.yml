services:

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    env_file: .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tooli-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tooli-net

  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?Set EVOLUTION_DB_PASSWORD in .env}
    volumes:
      - evolution-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      tooli-net:
        aliases:
          - postgres

  evolution-api:
    build:
      context: .
      dockerfile: Dockerfile.evolution
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8081:8080"
    environment:
      - DATABASE_PROVIDER=postgresql
      - DATABASE_URL=postgresql://user:${EVOLUTION_DB_PASSWORD:?Set EVOLUTION_DB_PASSWORD in .env}@postgres:5432/evolution
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - WEBHOOK_GLOBAL_URL=http://backend:3000/webhook
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_GLOBAL_BY_EVENTS=false
      - WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
      - LOG_COLOR=true
      - LOG_BAILEYS=error
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#000000
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1035194821
    volumes:
      - evolution-instances:/evolution/instances
    depends_on:
      evolution-postgres:
        condition: service_healthy
    networks:
      - tooli-net

  chatwoot-postgres:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
    volumes:
      - chatwoot-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tooli-net

  chatwoot-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - chatwoot-redis-data:/data
    networks:
      - tooli-net

  chatwoot-init:
    image: chatwoot/chatwoot:v3.16.0
    platform: linux/amd64
    restart: "no"
    env_file: .env.chatwoot
    entrypoint: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
    networks:
      - tooli-net

  chatwoot-app:
    image: chatwoot/chatwoot:v3.16.0
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3001:3000"
    env_file: .env.chatwoot
    volumes:
      - chatwoot-storage:/app/storage
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_started
      chatwoot-init:
        condition: service_completed_successfully
    networks:
      - tooli-net

  chatwoot-worker:
    image: chatwoot/chatwoot:v3.16.0
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env.chatwoot
    volumes:
      - chatwoot-storage:/app/storage
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_started
      chatwoot-init:
        condition: service_completed_successfully
    networks:
      - tooli-net

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml.tpl:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    entrypoint:
      - /bin/sh
      - -c
      - sed "s|__TOKEN__|${WEBHOOK_SECRET}|" /etc/prometheus/prometheus.yml.tpl > /tmp/prometheus.yml && exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d --web.enable-lifecycle
    depends_on:
      - alertmanager
    networks:
      - tooli-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9093:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tpl:ro
      - alertmanager-data:/alertmanager
    entrypoint:
      - /bin/sh
      - -c
      - sed -e "s|__SLACK_WEBHOOK_URL__|${SLACK_WEBHOOK_URL:-}|" -e "s|__ALERT_EMAIL_TO__|${ALERT_EMAIL_TO:-}|" -e "s|__ALERT_EMAIL_FROM__|${ALERT_EMAIL_FROM:-}|" -e "s|__SMTP_HOST__|${SMTP_HOST:-}|" -e "s|__SMTP_USER__|${SMTP_USER:-}|" -e "s|__SMTP_PASSWORD__|${SMTP_PASSWORD:-}|" /etc/alertmanager/alertmanager.yml.tpl > /tmp/alertmanager.yml && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    networks:
      - tooli-net

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - tooli-net

volumes:
  redis-data:
  chatwoot-redis-data:
  chatwoot-storage:
  evolution-instances:
  evolution-pg-data:
  chatwoot-pg-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

networks:
  tooli-net:
    driver: bridge
